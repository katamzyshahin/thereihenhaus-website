heading_de: "Learning by doing,<br>seit Tag eins."
heading_en: "Learning by doing,<br>since day one."
paragraph1_de: "Wir sind Ramzy und Kati, ein DIY-Paar aus der Schweiz. Wir wohnen seit 2021 in unserem Reihenhaus und legen seitdem gerne an den Abenden selbst Hand an."
paragraph1_en: "We're Ramzy and Kati, a DIY couple from Switzerland. We've lived in our rowhouse since 2021 and love getting our hands dirty in the evenings."
paragraph2_de: 'Was als "schnell ein Regal bauen" begann, ist heute ein kontinuierliches Verändern und Optimieren: Garten, Innenräume, Möbel, Upcycling und hilfreiche Alltags-Hacks. Wir dokumentieren alles auf Instagram und bald auch auf YouTube, nicht weil wir Experten sind, sondern weil wir lernen und es gerne mit euch teilen.'
paragraph2_en: 'What started as "just building a shelf" has become a continuous process of changing and improving: garden, interiors, furniture, upcycling, and handy everyday hacks. We document everything on Instagram and soon YouTube too, not because we''re experts, but because we''re learning and love sharing it with you.'
